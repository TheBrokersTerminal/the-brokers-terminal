[functions]
  directory = "netlify/functions"

[functions."search"]
  timeout_seconds = 26

[functions."search-stream"]
  timeout_seconds = 26

[functions."explain"]
  timeout_seconds = 26

[functions."purge-old-messages"]
  schedule = "0 3 1 * *"

[functions."cache-seed"]
  schedule = "0 2 * * *"

[functions."route-history"]
  timeout_seconds = 26

[functions."fetch-cftc-data"]
  schedule = "0 21 * * 5"

[functions."monitor-health"]
  schedule = "*/30 * * * *"

[functions."monitor-whiskystats"]
  schedule = "0 9 * * *"

[functions."monitor-stripe"]
  schedule = "0 8 * * *"

[functions."monitor-users"]
  schedule = "0 7 * * *"
