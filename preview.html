<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE BROKERS TERMINAL — Preview</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0A0A0A; font-family: 'Courier New', monospace; color: #fff; }
    #loading {
      display: flex; align-items: center; justify-content: center;
      height: 100vh; font-size: 10px; letter-spacing: 0.24em;
      text-transform: uppercase; color: #E97132;
    }
    #print-btn {
      display: none; position: fixed; bottom: 20px; right: 20px; z-index: 9999;
      background: #E97132; color: #000; border: none; font-family: 'Courier New', monospace;
      font-size: 9px; font-weight: 700; letter-spacing: 0.20em; text-transform: uppercase;
      padding: 10px 18px; cursor: pointer;
    }
    #viewer { display: none; width: 100%; height: 100vh; border: none; }
  </style>
</head>
<body>
  <div id="loading">Loading report…</div>
  <button id="print-btn" onclick="printReport()">⎙ SAVE AS PDF</button>
  <iframe id="viewer" sandbox="allow-same-origin allow-scripts allow-popups allow-modals"></iframe>
  <script>
    var reportHtml = '';
    var path = window.location.pathname.replace(/^\/view\//, '');

    if (!path) {
      document.getElementById('loading').textContent = 'No report path specified.';
    } else {
      fetch('https://oqpodikelxhwcnjdwojw.supabase.co/storage/v1/object/public/Reports/' + path)
        .then(function(r) {
          if (!r.ok) throw new Error('Could not load report (' + r.status + ')');
          return r.text();
        })
        .then(function(html) {
          reportHtml = html;
          var iframe = document.getElementById('viewer');
          iframe.srcdoc = html;
          iframe.style.display = 'block';
          document.getElementById('loading').style.display = 'none';
          document.getElementById('print-btn').style.display = 'block';
        })
        .catch(function(e) {
          document.getElementById('loading').textContent = 'Error: ' + e.message;
        });
    }

    function printReport() {
      var iframe = document.getElementById('viewer');
      var iDoc = iframe.contentDocument || iframe.contentWindow.document;

      ['tbt-print-css', 'tbt-measure-css'].forEach(function(id) {
        var el = iDoc.getElementById(id);
        if (el) el.parentNode.removeChild(el);
      });

      // Step 1: Apply print-equivalent layout on SCREEN so scrollHeight
      // matches what will actually render in the PDF.
      // Without this, vh-based cover/back heights and padding differences
      // cause the measured height to be wrong and leave blank space at end.
      var measureStyle = iDoc.createElement('style');
      measureStyle.id = 'tbt-measure-css';
      measureStyle.textContent = [
        '.cover, .cover-wrap { min-height: 297mm !important; }',
        '.back { min-height: 297mm !important; }',
        '.page { padding: 6mm 17mm !important; }',
        '.content { padding: 6mm 17mm !important; }',
        '.metrics-row { margin: 0 !important; padding: 0 !important; }',
        '.ticker-wrap, .sidebar, nav, .audio-bar, .audio-player, .audio-wrap { display: none !important; }'
      ].join('\n');
      iDoc.head.appendChild(measureStyle);

      // Step 2: Wait one frame for reflow, then measure and print
      requestAnimationFrame(function() {
        var heightPx = iDoc.documentElement.scrollHeight;
        var heightMm = Math.ceil(heightPx * 25.4 / 96);

        // Remove measure style before print so screen view is clean
        iDoc.head.removeChild(measureStyle);

        // Step 3: Inject print CSS with the accurately measured page height
        var style = iDoc.createElement('style');
        style.id = 'tbt-print-css';
        style.textContent = [
          '@media print {',
          '  @page { size: 210mm ' + heightMm + 'mm; margin: 0; }',
          '  *, *::before, *::after {',
          '    -webkit-print-color-adjust: exact !important;',
          '    print-color-adjust: exact !important;',
          '    color-adjust: exact !important;',
          '    break-inside: auto !important;',
          '    page-break-inside: auto !important;',
          '    break-before: auto !important;',
          '    page-break-before: auto !important;',
          '    break-after: auto !important;',
          '    page-break-after: auto !important;',
          '  }',
          '  .page-wrap, .cover-wrap { box-shadow: none !important; width: 100% !important; max-width: 100% !important; margin: 0 !important; }',
          '  .cover, .cover-wrap, .back, .page {',
          '    break-after: auto !important; page-break-after: auto !important;',
          '    break-before: auto !important; page-break-before: auto !important;',
          '  }',
          '  .page { padding: 6mm 17mm !important; }',
          '  .content { padding: 6mm 17mm !important; }',
          '  .metrics-row { margin: 0 !important; padding: 0 !important; flex-wrap: wrap !important; }',
          '  .metric { flex: 0 0 32% !important; padding: 10px 8px !important; }',
          '  .ticker-wrap, .sidebar, nav, .audio-bar, .audio-player, .audio-wrap { display: none !important; }',
          '  .page-layout { display: block !important; padding: 0 !important; }',
          '  .main-content { width: 100% !important; padding: 0 !important; }',
          '  table { width: 100% !important; }',
          '  img { max-width: 100% !important; height: auto !important; }',
          '  /* Remove text/box shadows — blur-radius shadows render as solid colour boxes in PDF */',
          '  * { text-shadow: none !important; box-shadow: none !important; }',
          '}'
        ].join('\n');
        iDoc.head.appendChild(style);

        iframe.contentWindow.focus();
        iframe.contentWindow.print();
      });
    }
  </script>
</body>
</html>
