<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE BROKERS TERMINAL — Market Intelligence Feed</title>
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="intel-search.css">
<style>
html, body { height: 100%; overflow: hidden; }

.terminal-wrap {
  display: flex; flex-direction: column;
  height: 100%;
  background: #080808; overflow: hidden;
}

/* ── TOOLBAR ─────────────────────────────────────────────────── */
.tb {
  display: flex; align-items: stretch;
  height: 36px; background: #0a0a0a;
  border-bottom: 1px solid #1a1a1a; flex-shrink: 0;
}
.tb-seg {
  display: flex; align-items: center; gap: 6px;
  padding: 0 14px; border-right: 1px solid #1a1a1a;
  font-family: var(--font); font-size: 9px; letter-spacing: .20em;
  text-transform: uppercase; color: #fff; white-space: nowrap; user-select: none;
  cursor: pointer; transition: color .1s;
}
.tb-seg:hover { color: #ccc; }
.tb-seg.active { color: var(--accent,#E97132); }
.tb-search-seg {
  display: flex; align-items: center; gap: 8px;
  padding: 0 14px; border-right: 1px solid #1a1a1a; flex: 1; max-width: 460px;
  border-bottom: 1px solid transparent; transition: border-color .15s;
}
.tb-search-seg:focus-within { border-bottom-color: var(--accent,#E97132); }
.tb-search-icon { color: var(--accent,#E97132); font-size: 15px; opacity: .7; }
#news-search {
  background: transparent; border: none; outline: none;
  color: #fff; font-family: var(--font); font-size: 10px; letter-spacing: .06em; width: 100%;
}
#news-search::placeholder { color: #888; }
.tb-right {
  display: flex; align-items: center; gap: 14px;
  padding: 0 18px; margin-left: auto;
  font-family: var(--font); font-size: 8px; letter-spacing: .20em; text-transform: uppercase; color: #444;
}
.tb-live-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent,#E97132); animation: ldp 2s ease-in-out infinite;
}
@keyframes ldp { 0%,100%{opacity:1} 50%{opacity:.3} }
.tb-live-lbl { color: var(--accent,#E97132); }

/* ── PANELS ──────────────────────────────────────────────────── */
.panels { display: flex; flex: 1; overflow: hidden; min-height: 0; }

/* ═══ LEFT PANEL ════════════════════════════════════════════════ */
.feed-panel {
  width: 42%; min-width: 340px; max-width: 560px;
  display: flex; flex-direction: column;
  border-right: 1px solid var(--accent,#E97132); border-left: 2px solid var(--accent,#E97132);
  background: #080808; flex-shrink: 0;
}
.cat-bar-wrap {
  display: flex; align-items: stretch; height: 38px; background: #0a0a0a;
  border-bottom: 1px solid #1e1e1e; flex-shrink: 0; position: relative;
}
.cat-scroll-btn {
  background: #0a0a0a; border: none; border-right: 1px solid #1e1e1e;
  color: #555; font-size: 10px; padding: 0 8px; cursor: pointer; flex-shrink: 0;
  transition: color .1s; z-index: 1;
}
.cat-scroll-btn:last-child { border-right: none; border-left: 1px solid #1e1e1e; }
.cat-scroll-btn:hover { color: var(--accent,#E97132); }
.cat-bar {
  display: flex; align-items: center; gap: 4px; padding: 0 6px;
  overflow-x: auto; scrollbar-width: none; flex: 1;
}
.cat-bar::-webkit-scrollbar { display: none; }
.cat-tab {
  background: none; border: none; border-bottom: 2px solid transparent;
  color: #fff; font-family: var(--font); font-size: 10px; letter-spacing: .14em;
  text-transform: uppercase; padding: 0 14px; cursor: pointer; white-space: nowrap;
  transition: color .1s, border-color .1s; flex-shrink: 0; height: 100%;
}
.cat-tab:hover { color: #fff; }
.cat-tab.active { color: var(--accent,#E97132); border-bottom-color: var(--accent,#E97132); }

.feed-hdr {
  display: grid; grid-template-columns: 56px 68px 1fr 20px;
  padding: 5px 0 4px 10px; background: #090909; border-bottom: 1px solid #1e1e1e;
  font-family: var(--font); font-size: 6.5px; letter-spacing: .30em;
  text-transform: uppercase; color: #666; flex-shrink: 0;
}
.feed-list {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  scrollbar-width: thin; scrollbar-color: #1a1a1a transparent;
}
.feed-list::-webkit-scrollbar { width: 3px; }
.feed-list::-webkit-scrollbar-thumb { background: #1a1a1a; border-radius: 2px; }

/* ── ROWS ────────────────────────────────────────────────────── */
.nrow {
  display: grid; grid-template-columns: 56px 68px 1fr 20px;
  border-bottom: 1px solid #111; cursor: pointer; background: #080808;
  transition: background .07s; min-height: 54px; align-items: start;
}
.nrow:nth-child(even) { background: #0a0a0a; }
.nrow:hover { background: #111; }
.nrow.active { background: #141414; border-left: 2px solid var(--accent,#E97132); border-bottom-color: #1c1c1c; }
.nrow.nflash { animation: nf 1.4s ease-out; }
@keyframes nf { 0%{background:rgba(233,113,50,.12)} 100%{background:#080808} }

.r-time {
  padding: 10px 4px 10px 10px; font-family: var(--font); font-size: 9.5px;
  color: #fff; font-variant-numeric: tabular-nums; letter-spacing: .04em; line-height: 1.2;
}
.r-time-date { display: block; font-size: 7.5px; color: #fff; margin-top: 3px; letter-spacing: .08em; }

.r-src { padding: 9px 4px; display: flex; flex-direction: column; gap: 5px; align-items: flex-start; }
.r-src-lbl { font-family: var(--font); font-size: 8.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
.rs-rtrs { color: var(--accent,#E97132); }
.rs-ft   { color: #c8891a; }
.rs-bbg  { color: #5a8fc0; }
.rs-wsj  { color: #fff; }
.rs-cnbc { color: #c04040; }
.rs-default { color: #fff; }
.r-tickers {
  font-family: var(--font); font-size: 7.5px; color: #fff; letter-spacing: .08em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 64px;
}
.nrow.active .r-tickers { color: rgba(233,113,50,.45); }

.r-main { padding: 8px 6px 8px 4px; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.r-hl {
  font-family: var(--font); font-size: 11.5px; color: #fff; line-height: 1.40;
  letter-spacing: .008em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.nrow:hover .r-hl { color: #fff; }
.nrow.active .r-hl { color: #fff; }
.r-tags { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
.rtag { font-family: var(--font); font-size: 7px; letter-spacing: .20em; font-weight: 700; text-transform: uppercase; padding: 1px 6px; border: 1px solid; }
.rt-gold      { color: var(--accent,#E97132); border-color: rgba(233,113,50,.35); }
.rt-macro     { color: #888; border-color: #2a2a2a; }
.rs-fj        { color: #7cb8e8; }
.rt-forex     { color: #5a9fc8; border-color: rgba(90,159,200,.3); }
.rt-commodity { color: #7ab87a; border-color: rgba(122,184,122,.3); }
.rt-markets   { color: #9878c8; border-color: rgba(152,120,200,.3); }
.rt-geo       { color: #c85050; border-color: rgba(200,80,80,.3); }
.rt-crypto    { color: #f0c040; border-color: rgba(240,192,64,.3); }
.rtag-new { font-family: var(--font); font-size: 7px; letter-spacing: .20em; font-weight: 700; color: #000; background: var(--accent,#E97132); border: 1px solid var(--accent,#E97132); padding: 1px 6px; }

.r-ind { display: flex; align-items: flex-start; justify-content: center; padding-top: 12px; font-size: 11px; color: #222; }
.nrow.active .r-ind { color: var(--accent,#E97132); }

/* ═══ RIGHT: ARTICLE + QUOTES ════════════════════════════════ */
.article-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #0a0a0a; min-width: 0; }
.art-panel-body { display: flex; flex: 1; overflow: hidden; min-height: 0; }

.art-scroll { flex: 1; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #1a1a1a transparent; min-width: 0; }
.art-scroll::-webkit-scrollbar { width: 3px; }
.art-scroll::-webkit-scrollbar-thumb { background: #1a1a1a; }

/* Empty state */
.art-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; min-height: 300px; gap: 10px; }
.art-empty-icon { font-size: 20px; color: var(--accent,#E97132); opacity: .3; }
.art-empty-lbl { font-family: var(--font); font-size: 8px; letter-spacing: .38em; text-transform: uppercase; color: #fff; }
.art-empty-sub { font-family: var(--font); font-size: 7px; letter-spacing: .22em; color: #fff; }

/* ── Article typography ──────────────────────────────────────── */
.art-inner { padding: 24px 28px 40px; }

.art-pill {
  display: inline-block; font-family: var(--font); font-size: 7.5px; letter-spacing: .24em;
  text-transform: uppercase; font-weight: 700; padding: 2px 10px; margin-bottom: 14px; border: 1px solid;
}
.ap-gold      { color: var(--accent,#E97132); border-color: rgba(233,113,50,.4); }
.ap-macro     { color: #888; border-color: #2a2a2a; }
.ap-forex     { color: #5a9fc8; border-color: rgba(90,159,200,.35); }
.ap-commodity { color: #7ab87a; border-color: rgba(122,184,122,.35); }
.ap-markets   { color: #9878c8; border-color: rgba(152,120,200,.35); }
.ap-geo       { color: #c85050; border-color: rgba(200,80,80,.35); }
.ap-crypto    { color: #f0c040; border-color: rgba(240,192,64,.35); }

.art-hl { font-family: var(--font); font-size: 19px; font-weight: 700; color: #fff; line-height: 1.28; letter-spacing: .02em; margin-bottom: 12px; text-transform: uppercase; }

.art-byline { display: flex; align-items: center; gap: 10px; font-family: var(--font); font-size: 8.5px; letter-spacing: .15em; text-transform: uppercase; color: #fff; margin-bottom: 18px; flex-wrap: wrap; }
.art-byline-src { color: var(--accent,#E97132); }
.art-byline-dot { color: #fff; }

.art-hr { border: none; border-top: 1px solid #181818; margin: 0 0 18px; }

/* Key takeaways */
.art-bullets {
  list-style: none; padding: 0 0 0 14px; margin: 0 0 20px;
  border-left: 2px solid var(--accent,#E97132);
}
.art-bullets li {
  font-family: var(--font); font-size: 11.5px; color: #fff;
  line-height: 1.55; letter-spacing: .010em; margin-bottom: 7px; padding-left: 2px;
}
.art-bullets li::before { content: '▪ '; color: var(--accent,#E97132); font-size: 9px; }

/* Body text */
.art-body { font-family: var(--font); font-size: 12px; color: #fff; line-height: 1.88; letter-spacing: .012em; margin-bottom: 8px; }
.art-body p { margin: 0 0 1em; }

/* Section header */
.art-sec-hdr {
  font-family: var(--font); font-size: 7.5px; letter-spacing: .30em; text-transform: uppercase;
  color: #fff; border-bottom: 1px solid #1a1a1a; padding-bottom: 8px; margin: 28px 0 14px;
  display: flex; align-items: center; justify-content: space-between;
}
.art-sec-hdr-price { font-size: 10px; letter-spacing: .08em; color: #fff; font-variant-numeric: tabular-nums; }

/* Market snapshot card */
.mkt-snap { padding: 14px 16px 12px; background: #090909; border: 1px solid #1a1a1a; margin-bottom: 8px; }
.mkt-loading { font-family: var(--font); font-size: 7px; letter-spacing: .28em; text-transform: uppercase; color: #fff; text-align: center; padding: 20px 16px; background: #090909; border: 1px solid #1a1a1a; }
.mkt-main { display: flex; align-items: baseline; gap: 14px; margin-bottom: 12px; flex-wrap: wrap; }
.mkt-price { font-family: var(--font); font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; color: #fff; }
.mkt-chg { font-family: var(--font); font-size: 11.5px; letter-spacing: .06em; font-variant-numeric: tabular-nums; }
.mkt-range-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.mkt-rlbl { font-family: var(--font); font-size: 8.5px; letter-spacing: .08em; color: #fff; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mkt-bar { flex: 1; height: 3px; background: #1c1c1c; position: relative; border-radius: 2px; }
.mkt-bar-fill { position: absolute; top: 0; height: 100%; border-radius: 2px; opacity: .75; }
.mkt-stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; padding-top: 10px; border-top: 1px solid #141414; }
.mkt-stat { display: flex; flex-direction: column; gap: 4px; }
.mkt-stat-l { font-family: var(--font); font-size: 6.5px; letter-spacing: .24em; text-transform: uppercase; color: #fff; }
.mkt-stat-v { font-family: var(--font); font-size: 12px; color: #fff; font-variant-numeric: tabular-nums; }
.mkt-spark { margin-top: 14px; border-top: 1px solid #141414; padding-top: 12px; }
.mkt-spark-lbl { font-family: var(--font); font-size: 6.5px; letter-spacing: .22em; text-transform: uppercase; color: #3a3a3a; margin-bottom: 8px; }
#mkt-canvas { background: #090909; }
.chart-axis { display: flex; justify-content: space-between; padding: 4px 10px 0; font-family: var(--font); font-size: 7px; letter-spacing: .10em; color: #fff; }

/* Related stories */
.art-related-row {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 10px 0; border-bottom: 1px solid #111;
  cursor: pointer; transition: background .08s; margin: 0 -28px; padding-left: 28px; padding-right: 28px;
}
.art-related-row:hover { background: #0f0f0f; }
.art-related-time { font-family: var(--font); font-size: 8px; letter-spacing: .12em; color: #fff; white-space: nowrap; flex-shrink: 0; padding-top: 2px; width: 52px; }
.art-related-src  { font-family: var(--font); font-size: 8px; font-weight: 700; letter-spacing: .12em; white-space: nowrap; flex-shrink: 0; padding-top: 2px; width: 38px; }
.art-related-hl { font-family: var(--font); font-size: 11px; color: #fff; line-height: 1.4; transition: color .1s; }
.art-related-row:hover .art-related-hl { color: #fff; }

/* Attribution */
.art-attribution { font-family: var(--font); font-size: 7px; letter-spacing: .20em; text-transform: uppercase; color: #fff; padding-top: 20px; margin-top: 10px; border-top: 1px solid #141414; }

/* Extended content */
.art-extended { font-family: var(--font); font-size: 12px; color: #fff; line-height: 1.88; letter-spacing: .012em; border-top: 1px solid #141414; padding-top: 16px; margin-top: 4px; }
.art-extended p { margin: 0 0 1em; }

/* ── QUOTES SIDEBAR ──────────────────────────────────────────── */
.quotes-panel { width: 182px; border-left: 1px solid #1a1a1a; background: #090909; display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; }
.qp-hdr { padding: 10px 12px 8px; font-family: var(--font); font-size: 7px; letter-spacing: .30em; text-transform: uppercase; color: #fff; border-bottom: 1px solid #141414; flex-shrink: 0; }
.qp-list { flex: 1; overflow-y: auto; scrollbar-width: none; }
.qp-list::-webkit-scrollbar { display: none; }
.q-row { padding: 9px 12px 7px; border-bottom: 1px solid #111; cursor: default; transition: background .1s; }
.q-row:hover { background: #111; }
.q-top   { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 2px; }
.q-lbl   { font-family: var(--font); font-size: 7.5px; letter-spacing: .12em; color: #fff; text-transform: uppercase; }
.q-price { font-family: var(--font); font-size: 13px; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; line-height: 1; margin-bottom: 2px; }
.q-chg   { font-family: var(--font); font-size: 8px; font-variant-numeric: tabular-nums; letter-spacing: .06em; }
.q-up    { color: #4caf50; }
.q-dn    { color: #e05050; }
.q-flat  { color: #fff; }
.q-spark { display: block; width: 100%; height: 28px; margin-top: 4px; }
.qp-ftr  { padding: 7px 12px; font-family: var(--font); font-size: 6px; letter-spacing: .18em; color: #fff; border-top: 1px solid #141414; flex-shrink: 0; }

.art-read-link { margin-left: auto; font-family: var(--font); font-size: 7.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--accent,#E97132); text-decoration: none; border: 1px solid rgba(233,113,50,.35); padding: 3px 8px; white-space: nowrap; transition: background .1s; }
.art-read-link:hover { background: rgba(233,113,50,.1); }

/* ── STATUS BAR ──────────────────────────────────────────────── */
.feed-status { height: 26px; background: #060606; border-top: 1px solid #141414; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; font-family: var(--font); font-size: 6.5px; letter-spacing: .18em; text-transform: uppercase; color: #252525; flex-shrink: 0; }
.feed-status strong { color: #444; }

/* ── UTILITY ─────────────────────────────────────────────────── */
.state-msg { display: flex; align-items: center; justify-content: center; padding: 30px 14px; font-family: var(--font); font-size: 8px; letter-spacing: .28em; text-transform: uppercase; color: #fff; }
.ld::after { content:'...'; animation:lda 1.2s steps(3,end) infinite; }
@keyframes lda { 0%,33%{content:'.'} 66%{content:'..'} 100%{content:'...'} }

/* ── ARTICLE TAB BAR ─────────────────────────────────────────── */
.art-tab-bar {
  display: flex; align-items: stretch; height: 38px; background: #090909;
  border-bottom: 1px solid #1e1e1e; overflow-x: auto; scrollbar-width: none; flex-shrink: 0;
}
.art-tab-bar::-webkit-scrollbar { display: none; }
.art-tab {
  display: flex; align-items: center; gap: 8px; padding: 0 14px;
  border-right: 1px solid #151515; cursor: pointer; white-space: nowrap;
  font-family: var(--font); font-size: 9px; letter-spacing: .16em; text-transform: uppercase;
  color: #555; background: #090909; transition: color .1s, background .1s;
  max-width: 240px; min-width: 100px; flex-shrink: 0;
}
.art-tab:hover { background: #101010; }
.art-tab:hover .art-tab-cat { color: #fff; }
.art-tab.active { background: #0e0e0e; border-bottom: 2px solid var(--accent,#E97132); }
.art-tab-cat {
  font-family: var(--font); font-size: 10px; font-weight: 700;
  letter-spacing: .18em; text-transform: uppercase; flex-shrink: 0;
  color: #777; transition: color .1s;
}
.art-tab.active .art-tab-cat { color: var(--accent,#E97132); }
.art-tab-lbl { display: none; }
.art-tab-close {
  flex-shrink: 0; font-size: 10px; color: #333; background: none; border: none;
  padding: 0; cursor: pointer; line-height: 1; transition: color .1s; margin-left: auto;
}
.art-tab-close:hover { color: #e05050; }
.art-tab-popout {
  flex-shrink: 0; font-size: 11px; color: #888; background: none; border: none;
  padding: 0 1px; cursor: pointer; line-height: 1; transition: color .1s;
}
.art-tab-popout:hover { color: var(--accent,#E97132); }

/* ── BROKERS INTELLIGENCE PANEL ──────────────────────────────── */
.intel-panel { margin: 22px 0 8px; border: 1px solid #1e1e1e; border-left: 3px solid var(--accent,#E97132); background: #0c0c0c; }
.intel-hdr { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-bottom: 1px solid #1a1a1a; }
.intel-hdr-lbl { font-size: 7px; letter-spacing: .35em; text-transform: uppercase; color: var(--accent,#E97132); font-weight: 700; }
.intel-hdr-sub { font-size: 7px; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,0.5); }
.intel-loading { padding: 16px 14px; font-size: 9px; letter-spacing: .2em; color: #ffffff; text-transform: uppercase; }
.intel-loading .ld::after { content: '...'; animation: ldots 1.2s steps(3,end) infinite; }
@keyframes ldots { 0%{content:'.'} 33%{content:'..'} 66%{content:'...'} }
.intel-body { padding: 14px; }
.intel-section { margin-bottom: 14px; }
.intel-section:last-child { margin-bottom: 0; }
.intel-sec-lbl { font-size: 7px; letter-spacing: .3em; text-transform: uppercase; color: var(--accent,#E97132); margin-bottom: 6px; }
.intel-text { font-size: 11px; color: #d8d8d8; line-height: 1.85; letter-spacing: .01em; }
.intel-analogy { background: #111; border-left: 2px solid #333; padding: 8px 12px; margin: 8px 0 0; font-size: 11px; color: #bbb; line-height: 1.8; font-style: italic; }
.intel-pitch { background: #0f0f0f; border: 1px solid #222; border-left: 2px solid var(--accent,#E97132); padding: 10px 12px; font-size: 11px; color: #e8e8e8; line-height: 1.85; font-style: italic; }
.intel-risk { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 6px; font-size: 7px; letter-spacing: .2em; text-transform: uppercase; font-weight: 700; margin-bottom: 6px; }
.intel-risk.on  { background: rgba(68,204,136,.08); border: 1px solid rgba(68,204,136,.3); color: #44cc88; }
.intel-risk.off { background: rgba(255,85,85,.08);  border: 1px solid rgba(255,85,85,.3);  color: #ff5555; }
.intel-risk.neu { background: rgba(233,113,50,.08); border: 1px solid rgba(233,113,50,.3); color: var(--accent,#E97132); }
.intel-risk-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
.intel-risk.on  .intel-risk-dot { background: #44cc88; }
.intel-risk.off .intel-risk-dot { background: #ff5555; }
.intel-risk.neu .intel-risk-dot { background: var(--accent,#E97132); }
.intel-risk-reason { font-size: 10px; color: #999; line-height: 1.6; }
.intel-panel--idle { background: none; border: none; padding: 4px 0; }

function categorise(s) {

function ago(ts)  { var d=Math.floor(Date.now()/1000-ts); if(d<60)return d+'S AGO'; if(d<3600)return Math.floor(d/60)+'M AGO'; if(d<86400)return Math.floor(d/3600)+'H AGO'; return Math.floor(d/86400)+'D AGO'; }
function fmtPrice(c) { return c>=100?c.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):c.toFixed(5); }

/* ── FETCH FEED ────────────────────────────────────────────── */
function _normaliseFeed(items) {
  var merged=items.map(function(s,i){
    return {
      id: s.url||String(s.datetime)+i,
      headline: s.title,
      summary: s.description||'',
      source: s.source,
      url: s.url,
      datetime: s.datetime
    };
  });
  var seen=new Set(), dd=merged.filter(function(s){
    var k=s.url||s.headline.slice(0,50);
    if(seen.has(k))return false; seen.add(k); return true;
  });
  dd.sort(function(a,b){return b.datetime-a.datetime;});
  return dd;
}

function _applyFeed(dd, isFromCache) {
  dd.forEach(function(s){s._cat=categorise(s);s._isNew=!seenIds.has(s.id);seenIds.add(s.id);});
  allStories=dd; render();
  var lu=document.getElementById('last-updated');
  if(lu) lu.textContent=(isFromCache?'cached · ':'')+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

async function fetchFeed() {
  /* Show cached data immediately if available */
  var cached = _lsGetFeed();
  if (cached && cached.length) {
    _applyFeed(_normaliseFeed(cached), true);
  }
  /* Always fetch fresh in background */
  try {
    var ctrl=new AbortController(); setTimeout(function(){ctrl.abort();},12000);
    var res=await fetch('/.netlify/functions/rss',{signal:ctrl.signal});
    var items=res.ok?await res.json():[];
    if(items && items.length) {
      _lsSetFeed(items);
      _applyFeed(_normaliseFeed(items), false);
    }
  } catch(e) {
    if(!allStories.length) document.getElementById('feed-list').innerHTML='<div class="state-msg">FEED ERROR — RETRYING</div>';
  }
}

  });

  var list=document.getElementById('feed-list');
  if(!filtered.length){list.innerHTML='<div class="state-msg">NO STORIES MATCH</div>';return;}

  filtered.forEach(function(story){

    var row=document.createElement('div');

/* ── FRED MINI SPARKLINE FOR QUOTES PANEL ──────────────────── */
async function _fredSparkline(series, svgId, col) {
  try {
    if (!_fredCache[series]) {
      var res = await fetch('/.netlify/functions/macro-data?type=chart&series=' + series + '&years=1');
      var json = res.ok ? await res.json() : {};
      _fredCache[series] = (json.data && json.data.length) ? json.data : null;
    }
    var data = _fredCache[series];
    if (!data || data.length < 2) return;
    var cutoff = Date.now() - 60 * 86400 * 1000; /* 60 days */
    var slice = data.filter(function(pt){ return new Date(pt.d).getTime() >= cutoff; });
    if (slice.length < 4) slice = data.slice(-30);
    var vals = slice.map(function(pt){ return pt.v; });
    var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
    var rng = mx - mn || 1;
    var W = 158, H = 28, pad = 2;
    var pts = vals.map(function(v, i){
      var x = pad + (i / (vals.length - 1)) * (W - pad * 2);
      var y = H - pad - ((v - mn) / rng) * (H - pad * 2);
      return x.toFixed(1) + ',' + y.toFixed(1);
    });
    var svg = document.getElementById(svgId);
    if (!svg) return;
    var last = vals[vals.length - 1], first = vals[0];
    var fillCol = last >= first ? 'rgba(76,175,80,.12)' : 'rgba(224,80,80,.12)';
    var lineCol = last >= first ? '#4caf50' : '#e05050';
    var area = pts.join(' ') + ' ' + (W - pad).toFixed(1) + ',' + (H - pad) + ' ' + pad + ',' + (H - pad);
    svg.innerHTML =
      '<polygon points="'+area+'" fill="'+fillCol+'"/>'+
      '<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+lineCol+'" stroke-width="1.2"/>';
  } catch(e) { /* silent fail */ }
}

/* Fetch latest spot price from FRED. Returns {c, pc} or null. */
async function _fredPrice(series) {
  try {
    if (!_fredCache[series]) {
      var res = await fetch('/.netlify/functions/macro-data?type=chart&series=' + series + '&years=1');
      var json = res.ok ? await res.json() : {};
      _fredCache[series] = (json.data && json.data.length) ? json.data : null;
    }
    var data = _fredCache[series];
    if (!data || data.length < 2) return null;
    var cur = data[data.length - 1].v;
    var prev = data[data.length - 2].v;
    return { c: cur, pc: prev };
  } catch(e) { return null; }
}

/* ── PROFESSIONAL CANVAS CHART (terminal style) ─────────────── */
var CHART_PERDS = [
  {k:'1M', days:30},
  {k:'3M', days:91},
  {k:'1Y', days:365},
  {k:'2Y', days:730},
  {k:'5Y', days:1825},
];
/* FRED series cache — keyed by series ID, shared across all stories */
var _fredCache = {};

function paintChart(canvas, closes, times, col, mult) {
  var par = canvas.parentElement;
  var W = Math.floor((par ? (par.getBoundingClientRect().width||par.offsetWidth) : 0) || canvas.offsetWidth || 520);
  var H = 180;
  canvas.width = W; canvas.height = H;
  var ctx = canvas.getContext('2d');
  var n = closes.length; if (!n) return;
  var P = {t:12, r:10, b:24, l:58};
  var cw = W - P.l - P.r, ch = H - P.t - P.b;
  var minV = Math.min.apply(null,closes), maxV = Math.max.apply(null,closes);
  var pad = (maxV-minV)*0.08; minV -= pad; maxV += pad; var rng = maxV-minV||1;
  function yP(v){ return P.t+ch-((v-minV)/rng)*ch; }
  function xP(i){ return P.l+(i/Math.max(n-1,1))*cw; }
  /* bg */
  ctx.fillStyle='#090909'; ctx.fillRect(0,0,W,H);
  /* grid + y labels */
  ctx.font='8px monospace'; ctx.textAlign='right'; ctx.textBaseline='middle';
  for(var g=0;g<=4;g++){
    var gy=P.t+((4-g)/4)*ch, gv=minV+(g/4)*rng;
    ctx.strokeStyle='rgba(255,255,255,0.04)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(P.l,gy); ctx.lineTo(P.l+cw,gy); ctx.stroke();
    ctx.fillStyle='#3a3a3a';
    var fv=gv*mult;
    var lbl=fv>=10000?fv.toLocaleString('en-US',{maximumFractionDigits:0}):fv>=100?fv.toFixed(2):fv.toFixed(4);
    ctx.fillText(lbl, P.l-4, gy);
  }
  /* x labels */
  if(times&&times.length){
    ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#2e2e2e'; ctx.font='7px monospace';
    var step=Math.max(1,Math.floor(n/6));
    for(var ti=0;ti<n;ti+=step){
      var d=new Date(times[ti]*1000);
      ctx.fillText(d.toLocaleDateString('en-GB',{month:'short',year:'2-digit'}), xP(ti), P.t+ch+4);
    }
  }
  /* gradient area */
  var rc=parseInt(col.slice(1,3),16), gc2=parseInt(col.slice(3,5),16), bc=parseInt(col.slice(5,7),16);
  var grad=ctx.createLinearGradient(0,P.t,0,P.t+ch);
  grad.addColorStop(0,'rgba('+rc+','+gc2+','+bc+',0.28)');
  grad.addColorStop(1,'rgba('+rc+','+gc2+','+bc+',0)');
  ctx.beginPath(); ctx.moveTo(xP(0),P.t+ch);
  for(var i=0;i<n;i++) ctx.lineTo(xP(i),yP(closes[i]));
  ctx.lineTo(xP(n-1),P.t+ch); ctx.closePath();
  ctx.fillStyle=grad; ctx.fill();
  /* line */
  ctx.beginPath(); ctx.strokeStyle=col; ctx.lineWidth=1.6; ctx.lineJoin='round';
  for(var j=0;j<n;j++){ if(j===0)ctx.moveTo(xP(j),yP(closes[j])); else ctx.lineTo(xP(j),yP(closes[j])); }
  ctx.stroke();
  /* last price dashed + dot */
  var lastY=yP(closes[n-1]);
  ctx.setLineDash([3,3]); ctx.lineWidth=0.7; ctx.globalAlpha=0.45;
  ctx.beginPath(); ctx.moveTo(P.l,lastY); ctx.lineTo(P.l+cw,lastY); ctx.stroke();
  ctx.setLineDash([]); ctx.globalAlpha=1;
  ctx.beginPath(); ctx.arc(xP(n-1),lastY,3.5,0,Math.PI*2); ctx.fillStyle=col; ctx.fill();
}

function buildSnapHTML(storyId, c, pc, h, l, o, col, dir, chg, pct, cfg) {

  return '<div class="mkt-snap">'+

function _doPaint(storyId, closes, times, col, mult) {
  /* Retry until canvas has layout width */
  var attempt=0;
  function tryPaint(){
    var canvas=document.getElementById('mkt-canvas-'+storyId);
    if(!canvas) return;
    var par=canvas.parentElement;
    var W=par?Math.floor(par.getBoundingClientRect().width||par.offsetWidth):0;
    if(W<20 && attempt++<15){ setTimeout(tryPaint,60); return; }
    W=W||520;
    paintChart(canvas,closes,times,col,mult);
  }
  setTimeout(tryPaint,30);
}

async function _fetchAndPaintChart(storyId, cfg, col, period) {
  var perd = CHART_PERDS.find(function(p){ return p.k === period; }) || CHART_PERDS[2];
  var series = cfg.fred || 'SP500';
  /* Use cached 5Y data or fetch it */
  if (!_fredCache[series]) {
    try {
      var res = await fetch('/.netlify/functions/macro-data?type=chart&series=' + series + '&years=5');
      var json = res.ok ? await res.json() : {};
      _fredCache[series] = (json.data && json.data.length) ? json.data : null;
    } catch(e) { _fredCache[series] = null; }
  }
  var allData = _fredCache[series];
  if (!allData || !allData.length) return;
  /* Slice client-side by period */
  var cutoff = Date.now() - perd.days * 86400 * 1000;
  var slice = allData.filter(function(pt){ return new Date(pt.d).getTime() >= cutoff; });
  if (!slice.length) slice = allData.slice(-perd.days);
  var closes = slice.map(function(pt){ return pt.v; });
  var times  = slice.map(function(pt){ return Math.floor(new Date(pt.d).getTime() / 1000); });
  _doPaint(storyId, closes, times, col, 1);
}

async function drawChart(storyId, cfg) {
  var wrap=document.getElementById('cwrap-'+storyId);
  var prEl=document.getElementById('cpr-'+storyId);
  if(!wrap) return;

  /* Render snap immediately so chart appears without waiting for price data */
  var _col='#E97132';
  wrap.innerHTML=buildSnapHTML(storyId,0,0,0,0,0,_col,'▲',0,0,cfg);
  _fetchAndPaintChart(storyId,cfg,_col,'1Y');
  function _wireBtns(col){
    var cw=document.getElementById('mkt-chart-'+storyId);
    if(!cw) return;
    cw.querySelectorAll('.mkt-cp').forEach(function(btn){
      btn.addEventListener('click',function(){
        cw.querySelectorAll('.mkt-cp').forEach(function(b){b.classList.remove('active');});
        btn.classList.add('active');
        _fetchAndPaintChart(storyId,cfg,col,btn.dataset.p);
      });
    });
  }
  _wireBtns(_col);

  /* Async: fetch accurate price and update in place */
  try {
    var fq=null;
    if(cfg.fred) {
      fq=await _fredPrice(cfg.fred);
    }
    if(!fq && cfg.sym) {
      var q=await finnhubQ(cfg.sym);
      if(q&&(q.c||q.pc)){var m=cfg.mult||1;var rc=q.c||q.pc;fq={c:rc*m,pc:(q.pc||rc)*m,h:(q.h||rc)*m,l:(q.l||rc)*m,o:(q.o||q.pc||rc)*m};}
    }
    if(!fq||!document.getElementById('cwrap-'+storyId)) return;
    var c=fq.c,pc=fq.pc,h=fq.h||fq.c,l=fq.l||fq.c,o=fq.o||fq.pc;
    var chg=c-pc,pct=pc?(chg/pc*100):0;
    var col=pct>=0?'#E97132':'#e05050',dir=pct>=0?'▲':'▼';
    if(prEl) prEl.innerHTML='<span style="color:#aaa;">'+fmtPrice(c)+'</span>&nbsp;<span style="color:'+col+'">'+dir+'&nbsp;'+(pct>=0?'+':'')+pct.toFixed(2)+'%</span>';
    if(!document.getElementById('cwrap-'+storyId)) return;
    wrap.innerHTML=buildSnapHTML(storyId,c,pc,h,l,o,col,dir,chg,pct,cfg);
    _fetchAndPaintChart(storyId,cfg,col,'1Y');
    _wireBtns(col);
  } catch(e){}
}

/* ── FETCH QUOTES (Finnhub ETFs + open.er-api.com forex) ───── */
async function fetchQuotes(cat) {
  if(quotesLock)return; quotesLock=true;
  try {
    var syms=QUOTE_SYMS[cat]||QUOTE_SYMS.gold;
    var ql=document.getElementById('quotes-list');
    ql.innerHTML='<div class="state-msg" style="padding:14px 10px;font-size:7px;">LOADING<span class="ld"></span></div>';
    var erRates=null; try{erRates=await loadFxRates();}catch(e){}
    var res=await Promise.allSettled(syms.map(function(s){
      if(s.kind==='fx'){
        if(!erRates||!erRates[s.p]) return Promise.resolve(null);
        var c=erRate(erRates,s.p,s.inv);
        return Promise.resolve({l:s.l,c:c,pc:c,noChg:true,fred:s.fred});
      }
      if(s.fred) return _fredPrice(s.fred).then(function(q){return q?{l:s.l,c:q.c,pc:q.pc,fred:s.fred}:null;});
      if(s.sym) return finnhubQ(s.sym).then(function(q){var m=s.mult||1;var raw=q&&(q.c||q.pc);return raw?{l:s.l,c:(q.c||q.pc)*m,pc:(q.pc||q.c||raw)*m,fred:null}:null;});
      return Promise.resolve(null);
    }));
    ql.innerHTML='';
    res.forEach(function(r, ri){
      if(r.status!=='fulfilled'||!r.value)return;
      var v=r.value, chg=v.c-v.pc, pct=v.pc&&!v.noChg?(chg/v.pc*100):0;
      var dir=pct>0.005?'up':pct<-0.005?'dn':'flat';
      var chgStr=v.noChg?'—':(pct>=0?'+':'')+pct.toFixed(2)+'%'+(chg>=0?' ▲':' ▼');
      var spkId='qspk-'+ri+'-'+Date.now();
      var qrow=document.createElement('div'); qrow.className='q-row';
      qrow.innerHTML=
        '<div class="q-top"><span class="q-lbl">'+v.l+'</span><span class="q-chg q-'+dir+'">'+chgStr+'</span></div>'+
        '<div class="q-price">'+fmtPrice(v.c)+'</div>'+
        (v.fred?'<svg class="q-spark" id="'+spkId+'" viewBox="0 0 158 28" preserveAspectRatio="none"></svg>':'');
      ql.appendChild(qrow);
      /* async sparkline from FRED */
      if(v.fred)(function(fredSeries, svgId, upColor){
        var col=upColor;
        _fredSparkline(fredSeries, svgId, col);
      })(v.fred, spkId, dir==='up'?'#4caf50':dir==='dn'?'#e05050':'#888');
    });
    if(!ql.children.length)ql.innerHTML='<div class="state-msg" style="padding:14px 10px;font-size:7px;">—</div>';
  } finally {
    quotesLock=false;
  }
}

/* ── EXTENDED FETCH (best effort) ──────────────────────────── */
async function extendArticle(story) {
  var storyId=story.id;
  try {
    var ctrl=new AbortController(); setTimeout(function(){ctrl.abort();},9000);
    var res=await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(story.url),{signal:ctrl.signal});
    if(!res.ok||_sid!==storyId)return;
    var html=await res.text(); if(_sid!==storyId)return;
    var doc=new DOMParser().parseFromString(html,'text/html');
    doc.querySelectorAll('script,style,nav,header,footer,aside,iframe,noscript,[class*="ad"],[class*="promo"],[class*="related"],[class*="newsletter"],[class*="share"]').forEach(function(el){el.remove();});
    var sels=['[itemprop="articleBody"]','[class*="ArticleBody"]','[class*="article-body"]','[class*="story-body"]','[class*="body__content"]','[class*="article__body"]','[class*="post-body"]','[class*="entry-content"]','article','main'];
    var best='';
    for(var i=0;i<sels.length;i++){var el=doc.querySelector(sels[i]);if(!el)continue;var t=(el.innerText||el.textContent||'').replace(/\s+/g,' ').trim();if(t.length>best.length)best=t;if(best.length>800)break;}
    var bodyEl=document.getElementById('art-body-'+storyId);
    var existing=bodyEl?(bodyEl.textContent||'').trim():'';
    if(!best||best.length<existing.length+150)return;
    var paras=best.split(/\n\s*\n|\.\s{2,}/).filter(function(p){return p.trim().length>50;});
    if(paras.length<2)return;
    var extEl=document.getElementById('art-ext-'+storyId); if(!extEl||_sid!==storyId)return;
    extEl.innerHTML='<div class="art-extended">'+paras.map(function(p){return '<p>'+p.trim()+'</p>';}).join('')+'</div>';
  }catch(e){}
}

/* ── ARTICLE TAB SYSTEM ────────────────────────────────────── */
var _tabs=[], _activeTabId=null;

function openStoryTab(story) {
  /* If tab already exists, just activate it */
  var existing=_tabs.find(function(t){return t.id===story.id;});
  if(existing){ activateTab(story.id); openMobileArticle(); return; }
  /* Add new tab */
  _tabs.push(story);
  renderTabBar();
  activateTab(story.id);
  openMobileArticle();
}

function openMobileArticle() {
  if (window.innerWidth > 860) return;
  var panels = document.querySelector('.panels');
  if (panels) panels.classList.add('article-open');
}

function closeMobileArticle() {
  var panels = document.querySelector('.panels');
  if (panels) panels.classList.remove('article-open');
}

function renderTabBar() {
  var bar=document.getElementById('art-tab-bar');
  bar.innerHTML='';
  _tabs.forEach(function(story){
    var cat=story._cat||'markets';
    var tab=document.createElement('div');
    tab.className='art-tab'+(story.id===_activeTabId?' active':'');
    tab.dataset.id=story.id;
    tab.innerHTML=
      '<span class="art-tab-cat ap-'+cat+'">'+(CAT_TAG[cat]||cat.toUpperCase())+'</span>'+
      '<span class="art-tab-lbl">'+(story.headline||'').substring(0,40)+'</span>'+
      '<button class="art-tab-popout" title="Pop out">↗</button>'+
      '<button class="art-tab-close" title="Close">✕</button>';
    tab.setAttribute('draggable','true');
    tab.addEventListener('dragstart',function(e){
      e.dataTransfer.setData('storyId', String(story.id));
      e.dataTransfer.effectAllowed='move';
      tab.style.opacity='.4';
    });
    tab.addEventListener('dragend',function(e){
      tab.style.opacity='';
      /* Only pop out if dragged outside the tab bar */
      var bar=document.getElementById('art-tab-bar');
      var r=bar.getBoundingClientRect();
      if(e.clientY>r.bottom+20||e.clientX<r.left-40||e.clientX>r.right+40){
        spawnPopout(story, e.clientX, e.clientY);
      }
    });
    tab.addEventListener('click',function(e){
      if(e.target.classList.contains('art-tab-close')){ closeTab(story.id); return; }
      if(e.target.classList.contains('art-tab-popout')){ spawnPopout(story); return; }
      activateTab(story.id);
    });
    bar.appendChild(tab);
  });
}

function activateTab(id) {
  _activeTabId=id;
  var story=_tabs.find(function(t){return t.id===id;});
  if(!story)return;
  renderTabBar();
  renderArticle(story);
  /* Sync feed list highlight */
  document.querySelectorAll('.nrow.active').forEach(function(r){r.classList.remove('active');});
  var rowEl=document.querySelector('.nrow[data-id="'+id+'"]');
  if(rowEl)rowEl.classList.add('active');
}

function closeTab(id) {
  var idx=_tabs.findIndex(function(t){return t.id===id;});
  _tabs.splice(idx,1);
  if(_activeTabId===id){
    if(_tabs.length){ activateTab(_tabs[Math.max(0,idx-1)].id); }
    else{ _activeTabId=null; renderTabBar(); document.getElementById('art-scroll').innerHTML='<div class="art-empty"><div class="art-empty-icon">█</div><div class="art-empty-lbl">Select a story</div><div class="art-empty-sub">Click any headline to read</div></div>'; }
  } else { renderTabBar(); }
}

  var bullets=sentences.slice(0,Math.min(3,sentences.length));
  var bodyText=sentences.slice(bullets.length).join(' ');

  return {

      '<div class="art-hl">'+(story.headline||'')+'</div>'+
      '<div class="art-byline">'+
        '<span class="art-byline-src">'+src+'</span>'+
        '<span class="art-byline-dot">·</span>'+
        '<span>'+dmon(story.datetime)+'&nbsp;'+hms(story.datetime)+' GMT</span>'+
        '<span class="art-byline-dot">·</span><span>'+ago(story.datetime)+'</span>'+
        (story.url?'<a class="art-read-link" href="'+story.url+'" target="_blank" rel="noopener">READ FULL ARTICLE ↗</a>':'')+
      '</div><hr class="art-hr">'+
      '<ul class="art-bullets">'+bulletHTML+'</ul>'+
      bodyHTML+'<div id="art-ext-'+id+'"></div>'+

          '<span class="intel-hdr-lbl">▌ BROKERS INTELLIGENCE</span>'+

        '</div>'+
        '<div class="intel-loading"><span class="il-msg">READING THE BRIEF</span><span class="ld"></span></div>'+
      '</div>'+
      chartHTML+relHTML+
      '<div class="art-attribution">SOURCE: '+src.toUpperCase()+'</div>'+
    '</div>',
    cat:cat, chartCfg:chartCfg, id:id
  };

function spawnPopout(story, dropX, dropY) {
  /* If already open, just bring it to front */
  if(_openPopouts[story.id]){
    var ex=_openPopouts[story.id];
    ex.style.zIndex=++_popZ;
    ex.style.boxShadow='0 8px 40px rgba(233,113,50,.18)';
    setTimeout(function(){ex.style.boxShadow='0 8px 40px rgba(0,0,0,.7)';},600);
    return;
  }
  var pfx='pop'+story.id+'_';
  var art=buildArticleHTML(story,pfx);
  var cat=art.cat, chartCfg=art.chartCfg;

  /* Position: use drop coordinates if dragged, otherwise cascade */
  var left, top;
  if(dropX!=null && dropY!=null){
    left=Math.max(0,Math.min(dropX-20, window.innerWidth-580));
    top=Math.max(0,Math.min(dropY-15, window.innerHeight-500));
  } else {
    var off=(_popOffset%8)*28;
    left=Math.min(60+off, window.innerWidth-600);
    top=Math.min(70+off, window.innerHeight-500);
    _popOffset++;
  }

  var win=document.createElement('div');
  win.className='popwin';
  win.style.cssText='left:'+left+'px;top:'+top+'px;width:560px;height:600px;z-index:'+(++_popZ)+';';
  win.innerHTML=
    /* 8 resize handles */
    '<div class="pw-rs pw-rs-n" data-dir="n"></div>'+
    '<div class="pw-rs pw-rs-s" data-dir="s"></div>'+
    '<div class="pw-rs pw-rs-e" data-dir="e"></div>'+
    '<div class="pw-rs pw-rs-w" data-dir="w"></div>'+
    '<div class="pw-rs pw-rs-nw" data-dir="nw"></div>'+
    '<div class="pw-rs pw-rs-ne" data-dir="ne"></div>'+
    '<div class="pw-rs pw-rs-sw" data-dir="sw"></div>'+
    '<div class="pw-rs pw-rs-se" data-dir="se"></div>'+
    '<div class="popwin-bar">'+
      '<span class="popwin-pill ap-'+cat+'">'+(CAT_TAG[cat]||cat.toUpperCase())+'</span>'+
      '<span class="popwin-title">'+(story.headline||'')+'</span>'+
      '<div class="popwin-btns">'+
        '<button class="popwin-btn" data-zoom="-1" title="Shrink">−</button>'+
        '<button class="popwin-btn" data-zoom="1"  title="Grow">+</button>'+
        '<button class="popwin-btn grp" title="Group">⊞</button>'+
        '<button class="popwin-btn close" title="Close">✕</button>'+
      '</div>'+
    '</div>'+
    '<div class="popwin-body">'+art.html+'</div>';

  document.body.appendChild(win);
  _openPopouts[story.id]=win;

  win.addEventListener('mousedown',function(){win.style.zIndex=++_popZ;},true);

  win.querySelector('.popwin-btn.close').addEventListener('click',function(){
    win.remove(); delete _openPopouts[story.id];
  });

  /* Zoom buttons */
  win.querySelectorAll('.popwin-btn[data-zoom]').forEach(function(btn){
    btn.addEventListener('click',function(){
      var delta=parseInt(btn.dataset.zoom)*80;
      win.style.width=Math.max(300,win.offsetWidth+delta)+'px';
      win.style.height=Math.max(200,win.offsetHeight+delta*0.6)+'px';
    });
  });

  /* Related story clicks inside popout */
  win.addEventListener('click',function(e){
    var rr=e.target.closest('.art-related-row'); if(!rr)return;
    var sid=parseInt(rr.dataset.sid);
    var s2=allStories.find(function(s){return s.id===sid;});
    if(s2) spawnPopout(s2);
  });

  /* Drag from title bar */
  var bar=win.querySelector('.popwin-bar');
  var dx=0,dy=0,dragging=false;
  bar.addEventListener('mousedown',function(e){
    if(e.target.closest('.popwin-btn'))return;
    dragging=true; dx=e.clientX-win.offsetLeft; dy=e.clientY-win.offsetTop;
    win.style.zIndex=++_popZ; document.body.style.userSelect='none';
  });
  document.addEventListener('mousemove',function(e){
    if(!dragging)return;
    win.style.left=Math.max(0,Math.min(e.clientX-dx,window.innerWidth-100))+'px';
    win.style.top=Math.max(0,Math.min(e.clientY-dy,window.innerHeight-40))+'px';
  });
  document.addEventListener('mouseup',function(){dragging=false;document.body.style.userSelect='';});

  /* 8-directional resize */
  win.querySelectorAll('.pw-rs').forEach(function(handle){
    var dir=handle.dataset.dir;
    var rsx=0,rsy=0,rsW=0,rsH=0,rsL=0,rsT=0,resizing=false;
    handle.addEventListener('mousedown',function(e){
      e.stopPropagation(); e.preventDefault();
      resizing=true; rsx=e.clientX; rsy=e.clientY;
      rsW=win.offsetWidth; rsH=win.offsetHeight;
      rsL=win.offsetLeft; rsT=win.offsetTop;
      win.style.zIndex=++_popZ; document.body.style.userSelect='none';
      var onMove=function(e2){
        if(!resizing)return;
        var ddx=e2.clientX-rsx, ddy=e2.clientY-rsy;
        var nW=rsW, nH=rsH, nL=rsL, nT=rsT;
        if(dir.indexOf('e')>=0) nW=Math.max(300,rsW+ddx);
        if(dir.indexOf('w')>=0){ nW=Math.max(300,rsW-ddx); nL=rsL+rsW-nW; }
        if(dir.indexOf('s')>=0) nH=Math.max(200,rsH+ddy);
        if(dir.indexOf('n')>=0){ nH=Math.max(200,rsH-ddy); nT=rsT+rsH-nH; }
        win.style.width=nW+'px'; win.style.height=nH+'px';
        win.style.left=nL+'px'; win.style.top=nT+'px';
      };
      var onUp=function(){ resizing=false; document.body.style.userSelect=''; document.removeEventListener('mousemove',onMove); document.removeEventListener('mouseup',onUp); };
      document.addEventListener('mousemove',onMove);
      document.addEventListener('mouseup',onUp);
    });
  });

  /* Load data */
  if(chartCfg) drawChart(art.id,chartCfg);
  fetchQuotesInto(cat, win.querySelector('.popwin-body'));
  if(story.url) extendArticleInto(story, art.id);
  if (window._isOwner) fetchIntelligence(story, 'art-intel-'+art.id);
}

/* fetchQuotes into a specific container (for popouts) */
async function fetchQuotesInto(cat, container) {
  var syms=QUOTE_SYMS[cat]||QUOTE_SYMS.gold;
  var qlWrap=document.createElement('div');
  qlWrap.className='quotes-panel';
  qlWrap.innerHTML='<div class="qp-hdr">RELATED QUOTES</div><div class="qp-list" style="max-height:200px;overflow-y:auto;"></div><div class="qp-ftr">INDICATIVE</div>';
  container.appendChild(qlWrap);
  var ql=qlWrap.querySelector('.qp-list');
  ql.innerHTML='<div class="state-msg" style="padding:10px;font-size:7px;">LOADING<span class="ld"></span></div>';
  var res=await Promise.allSettled(syms.map(function(s){
    if(s.fred) return _fredPrice(s.fred).then(function(q){return q?{l:s.l,c:q.c,pc:q.pc}:null;});
    if(s.sym) return finnhubQ(s.sym).then(function(q){var m=s.mult||1;var raw=q&&(q.c||q.pc);return raw?{l:s.l,c:(q.c||q.pc)*m,pc:(q.pc||q.c||raw)*m}:null;});
    return Promise.resolve(null);
  }));
  ql.innerHTML='';
  res.forEach(function(r){
    if(r.status!=='fulfilled'||!r.value)return;
    var v=r.value, chg=v.c-v.pc, pct=v.pc?(chg/v.pc*100):0;
    var dir=pct>0.005?'up':pct<-0.005?'dn':'flat';
    var chgStr=(pct>=0?'+':'')+pct.toFixed(2)+'%'+(chg>=0?' ▲':' ▼');
    var qrow=document.createElement('div'); qrow.className='q-row';
    qrow.innerHTML='<div class="q-lbl">'+v.l+'</div><div class="q-price">'+fmtPrice(v.c)+'</div><div class="q-chg q-'+dir+'">'+chgStr+'</div>';
    ql.appendChild(qrow);
  });
  if(!ql.children.length)ql.innerHTML='<div class="state-msg" style="padding:10px;font-size:7px;">—</div>';
}

/* extendArticle for popout-specific IDs */
async function extendArticleInto(story, artId) {
  try {
    var ctrl=new AbortController(); setTimeout(function(){ctrl.abort();},9000);
    var res=await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(story.url),{signal:ctrl.signal});
    if(!res.ok)return;
    var html=await res.text();
    var doc=new DOMParser().parseFromString(html,'text/html');
    doc.querySelectorAll('script,style,nav,header,footer,aside,iframe,noscript,[class*="ad"],[class*="promo"],[class*="related"],[class*="newsletter"],[class*="share"]').forEach(function(el){el.remove();});
    var sels=['[itemprop="articleBody"]','[class*="ArticleBody"]','[class*="article-body"]','[class*="story-body"]','[class*="body__content"]','[class*="article__body"]','[class*="post-body"]','[class*="entry-content"]','article','main'];
    var best='';
    for(var i=0;i<sels.length;i++){var el=doc.querySelector(sels[i]);if(!el)continue;var t=(el.innerText||el.textContent||'').replace(/\s+/g,' ').trim();if(t.length>best.length)best=t;if(best.length>800)break;}
    if(!best)return;
    var paras=best.split(/\n\s*\n|\.\s{2,}/).filter(function(p){return p.trim().length>50;});
    if(paras.length<2)return;
    var extEl=document.getElementById('art-ext-'+artId); if(!extEl)return;
    extEl.innerHTML='<div class="art-extended">'+paras.map(function(p){return '<p>'+p.trim()+'</p>';}).join('')+'</div>';
  }catch(e){}
}

/* ── PANEL RESIZE ──────────────────────────────────────────── */
(function(){
  var handle=document.getElementById('panel-resize');
  var feedPanel=document.getElementById('feed-panel');
  var panels=document.querySelector('.panels');
  var resizing=false, startX=0, startW=0;
  handle.addEventListener('mousedown',function(e){
    resizing=true; startX=e.clientX; startW=feedPanel.offsetWidth;
    handle.classList.add('dragging');
    document.body.style.cursor='col-resize'; document.body.style.userSelect='none';
  });
  document.addEventListener('mousemove',function(e){
    if(!resizing)return;
    var dx=e.clientX-startX, nw=Math.max(260,Math.min(startW+dx,panels.offsetWidth-260));
    feedPanel.style.width=nw+'px'; feedPanel.style.maxWidth=nw+'px';
  });
  document.addEventListener('mouseup',function(){
    if(!resizing)return; resizing=false;
    handle.classList.remove('dragging');
    document.body.style.cursor=''; document.body.style.userSelect='';
  });
})();
